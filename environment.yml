name: toxcast_env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11            # 반드시 3.11 (3.12 아님)
  # 과학/데이터 스택 (모두 conda-forge에서 맞춰 설치)
  - numpy=1.26.4
  - scipy=1.14.1
  - pandas=2.2.2
  - matplotlib=3.9.2
  - seaborn=0.13.2
  - scikit-learn=1.5.2
  - imbalanced-learn=0.12.3
  - xgboost=2.1.1
  - joblib=1.4.2
  - threadpoolctl=3.5.0
  - rdkit=2024.3.5
  - umap-learn=0.5.7
  - openpyxl
  - tqdm
  - requests
  - pyyaml
  - pip
  - pip:
      # CUDA 12.1 전용 PyTorch wheel 인덱스(추가 인덱스)
      - --extra-index-url https://download.pytorch.org/whl/cu121
      # DL 스택 (pip로 설치해야 채널 충돌이 없음)
      - torch==2.3.1
      - torchvision==0.18.1
      - torchaudio==2.3.1
      - torch-geometric==2.6.1
